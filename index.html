<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <script src="https://kit.fontawesome.com/63fac70219.js" crossorigin="anonymous"></script>
     <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #052ee1, #3cbe18);
        }

        .main {
            width: 500px;
            padding: 25px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .img-section {
            width: 100%;
            height: 350px;
            overflow: hidden;
            border-radius: 15px;
            background: #f1f1f1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .img-section img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .btn-section {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-top: 20px;
        }

        .btn-section button {
            flex: 1;
            padding: 13px 20px;
            border: none;
            border-radius: 10px;
            background: #da2e2e;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .btn-section button:hover {
            background: #4f46c5;
            transform: translateY(-2px);
        }

        .btn-section button:active {
            transform: translateY(0);
        }

        @media (max-width: 600px) {
            .main {
                width: 90%;
                padding: 15px;
            }

            .img-section {
                height: 250px;
            }

            .btn-section button {
                font-size: 14px;
                padding: 11px;
            }
        }
    </style>
</head>
<body>

    <div class="main">
        <div class="img-section">
            <img id="img-section" src="" alt="">
        </div>
        <div class="btn-section">
            <button id="preview" onclick="imageChanger('previous')">Previous</button>
            <button id="next" onclick="imageChanger('next')">Next</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
